spring.application.name=MayaComposite
server.port=8080
server.servlet.context-path=/api

# Set default encoding for the messages
spring.messages.encoding=UTF-8

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/maya
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT Configuration
jwt.secret-key=1e0be840c0da93b3ace5c53a97e77d99d4f3ca9a03e15198787852620fe2786d
# 10 hours in milliseconds
jwt.expiration-time=36000000

#api docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
# CORS
cors.allowed.origins=http://localhost:4200

spring.profiles.active=local
